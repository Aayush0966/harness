<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>IverDream Harness</title>
</head>

<body style="margin:0; display:flex; flex-direction:column; height:100vh">
  <top-bar-view id="topBar" style="position:sticky; top:0; z-index:100; flex-shrink:0"></top-bar-view>
  <div id="main" style="display:flex; flex:1; overflow:hidden">
    <side-bar-view id="sideBar"></side-bar-view>
    <div id="viewport" style="flex:1; overflow:auto; padding:8px"></div>
  </div>

  <script src="composite.js"></script>
  <script src="folder.js"></script>
  <script src="transducers.js"></script>
  <script src="engine.js"></script>
  <script src="libview.js"></script>
  <script>
    let steps = [], parentDir = null;
    let history = [], transducers = {}, uixComponents = {};
    const topBar = document.getElementById('topBar');
    const sideBar = document.getElementById('sideBar');
    const activeComponents = new Set();

    const getParam = key => new URLSearchParams(location.search).get(key);
    const setParam = (key, val) => {
      const p = new URLSearchParams(location.search);
      val == null ? p.delete(key) : p.set(key, val);
      window.history.replaceState(null, '', `?${p}`);
    };

    function orchestrate(changes) {
      if (changes.folder) history = [...history, changes.folder];
      if (changes.transducers) transducers = { ...transducers, ...changes.transducers };
      if (changes.uixComponents) uixComponents = { ...uixComponents, ...changes.uixComponents };
      for (const component of [topBar, sideBar, ...activeComponents]) component.update(history, transducers, uixComponents);
    }

    function mountView() {
      const viewport = document.getElementById('viewport');
      viewport.innerHTML = '';
      activeComponents.clear();
      const names = (getParam('view') || 'default-view').split(',').map(s => s.trim()).filter(Boolean);
      for (const name of names) {
        const el = document.createElement(name);
        viewport.appendChild(el);
        activeComponents.add(el);
      }
    }

    const viewport = document.getElementById('viewport');
    viewport.addEventListener('new-folder', e => orchestrate({ folder: e.detail }));
    orchestrate({
      transducers: { PerFileOps, PerFolderOps },
      uixComponents: { 'default-view': DefaultView, 'top-bar-view': TopBarView, 'side-bar-view': SideBarView },
    });

    document.addEventListener('pick-folder', () => pick());
    document.addEventListener('run-engine', e => {
      if (e.detail?.key) localStorage.setItem('iverdream_key', e.detail.key);
      main(e.detail?.key);
    });
    document.addEventListener('smart-prompt', e => {
      if (e.detail?.key) localStorage.setItem('iverdream_key', e.detail.key);
      smartPrompt(e.detail?.goal);
    });
    document.addEventListener('step-changed', () => orchestrate({}));

    const loadCustom = () => {
      const saved = JSON.parse(localStorage.getItem('iverdream_custom') || '{}');
      const customTransducers = {}, customUIX = {};
      for (const [name, src] of Object.entries(saved.transducers || {}))
        try { customTransducers[name] = eval(`(${src})`); } catch (e) { console.warn('skipped transducer', name, e); }
      for (const [name, src] of Object.entries(saved.uixComponents || {}))
        try {
          const cls = eval(`(${src})`);
          if (!customElements.get(name)) customElements.define(name, cls);
          customUIX[name] = cls;
        } catch (e) { console.warn('skipped uixComponent', name, e); }
      if (Object.keys(customTransducers).length) orchestrate({ transducers: customTransducers });
      if (Object.keys(customUIX).length) orchestrate({ uixComponents: customUIX });
    };

    const saveCustom = (key, name, value) => {
      const saved = JSON.parse(localStorage.getItem('iverdream_custom') || '{}');
      saved[key] = { ...(saved[key] || {}), [name]: value.toString() };
      localStorage.setItem('iverdream_custom', JSON.stringify(saved));
    };
    viewport.addEventListener('new-transducer', e => {
      saveCustom('transducers', e.detail.name, e.detail.value);
      orchestrate({ transducers: { [e.detail.name]: e.detail.value } });
    }, true);
    viewport.addEventListener('new-uix-component', e => {
      saveCustom('uixComponents', e.detail.name, e.detail.value);
      orchestrate({ uixComponents: { [e.detail.name]: e.detail.value } });
    }, true);
    loadCustom();

    async function pick() {
      try {
        parentDir = await showDirectoryPicker({ mode: 'readwrite' });
        steps = (await createFolders(parentDir)).taskList;
        mountView();
        const initialFolder = Composite.consume(await readFolder(parentDir));
        Composite.register(initialFolder);
        orchestrate({ folder: initialFolder });
      } catch (e) {
        if (e.name !== 'AbortError') throw e;
      }
    }

    async function main(key) {
      const apiKey = key || localStorage.getItem('iverdream_key');
      if (!apiKey) return;
      try {
        const currentFolder = history[history.length - 1];
        const newFolderState = await runEngineOnJson(currentFolder, steps);
        await writeFolder(parentDir, newFolderState);
        orchestrate({ folder: newFolderState });
      } catch (err) {
        console.error('Error during processing:', err);
      }
    }

    const smartPromptReferenceView = `class SingleFileView extends HTMLElement {
  update(history, transducers, uixComponents) {
    const names = (getParam('files') || '').split(',').filter(Boolean);
    const rootFolder = history[history.length - 1];
    const allFiles = (rootFolder.children || []).flatMap(c => 
      c.kind === 'file' ? [c] : (c.children || []).filter(sub => sub.kind === 'file')
    );
    const file = allFiles.find(f => names.length === 0 || names.includes(f.filename));
    if (!file) {
      this.textContent = 'No files found.';
      return;
    }
    this.textContent = typeof file.data === 'string' 
      ? file.data 
      : JSON.stringify(file.data, null, 2);
  }
}`;

    const smartPromptSystemMessage =
      'You write native Web Component view classes for a folder-based UI. ' +
      'A view is a class with update(history, transducers, uixComponents), called whenever state changes. ' +
      "Read the current file selection yourself via getParam('files') (comma-separated names) — never expect selection as an argument. " +
      'Views must use file.data, not just file.filename — a view that only lists names is wrong. ' +
      'CRITICAL RULES: ' +
      '1. Do NOT call customElements.define in the source; return only the class definition. ' +
      '2. The "name" in your JSON MUST be lowercase and contain a hyphen (e.g., "my-custom-view"). ' +
      '3. Your code MUST be 100% pure. Do not use external closures or global variables; everything must be self-contained. ' +
      '4. STRICT REUSE: You MUST check availableViews first. If an existing view fits the goal, put its name in "view" and set "newView" to null. ' +
      '5. ONLY write a "newView" if absolutely no existing view can handle the task. Reply with JSON only. ' +
      '6. HIERARCHY: Files are nested inside step subdirectories. Flatten the tree to find files.';

    async function smartPrompt(goal) {
      if (!goal || history.length === 0) return;

      const messages = [
        { role: 'system', content: smartPromptSystemMessage },
        {
          role: 'user', content: JSON.stringify({
            goal, currentView: getParam('view'), availableViews: Object.keys(uixComponents),
            folderName: history[history.length - 1].folderName, folderChildren: history[history.length - 1].children?.map(c => ({ kind: c.kind, ...(c.kind === 'directory' ? { folderName: c.folderName } : { filename: c.filename }) })),
            referenceView: smartPromptReferenceView,
          }) + '\n\nReply: { "view": "", "selectedFiles": [...], "newView": null | { "name": "", "source": "" } }'
        },
      ];

      try {
        const res = await llm({ model: 'deepseek/deepseek-chat', messages, response_format: { type: 'json_object' } });
        const { view, selectedFiles = [], newView } = JSON.parse(res.choices[0].message.content);

        if (newView && !customElements.get(newView.name)) {
          const cls = eval(`(${newView.source})`);
          customElements.define(newView.name, cls);
          viewport.dispatchEvent(new CustomEvent('new-uix-component', { bubbles: true, detail: { name: newView.name, value: cls } }));
        }

        const viewName = newView?.name || view;
        const current = new Set((getParam('view') || '').split(',').filter(Boolean));
        if (viewName) setParam('view', [...current.add(viewName)].join(','));
        if (selectedFiles.length) setParam('files', selectedFiles.join(','));

        mountView();
        orchestrate({});
      } catch (err) {
        console.error('Smart prompt error:', err);
      }
    }
  </script>
</body>

</html>
